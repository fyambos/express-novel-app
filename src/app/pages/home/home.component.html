<div class="container mx-auto p-4">
    <h1 class="text-3xl font-bold mb-4">Stories</h1>
    <div *ngIf="errorMessage" class="text-center text-red-500">
      <p>{{ errorMessage }}</p>
    </div>
    <div *ngIf="!isLoading && !errorMessage">
      <app-story-card
        *ngFor="let story of stories"
        [story]="story"
      ></app-story-card>
    </div>
    <div *ngIf="isLoading" class="space-y-6">
      <div class="flex flex-col space-y-4">
        <div class="p-4 border rounded-lg shadow-md bg-gray-100 dark:bg-gray-800 animate-pulse">
          <div class="flex justify-between">
            <div class="h-6 bg-gray-300 rounded w-1/3 dark:bg-gray-700 mb-4"></div>
            <div class="h-6 bg-gray-300 rounded w-1/5 dark:bg-gray-700 mb-4"></div>
          </div>
          <div class="h-4 bg-gray-300 rounded w-1/2 dark:bg-gray-700 mb-2"></div>
          <div class="h-32 bg-gray-300 rounded dark:bg-gray-700"></div>
        </div>
        <div class="p-4 border rounded-lg shadow-md bg-gray-100 dark:bg-gray-800 animate-pulse">
          <div class="flex justify-between">
            <div class="h-6 bg-gray-300 rounded w-1/3 dark:bg-gray-700 mb-4"></div>
            <div class="h-6 bg-gray-300 rounded w-1/5 dark:bg-gray-700 mb-4"></div>
          </div>
          <div class="h-4 bg-gray-300 rounded w-1/2 dark:bg-gray-700 mb-2"></div>
          <div class="h-32 bg-gray-300 rounded dark:bg-gray-700"></div>
        </div>
      </div>
    </div>
  </div>
